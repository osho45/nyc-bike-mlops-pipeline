name: nyc-bike-mlops
x-airflow-common-env: &airflow-common-env
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow_user:${POSTGRES_METADATA_PASSWORD:?Run python tools/init_local.py}@airflow-metadata-db:5432/airflow_metadata
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
  AIRFLOW__CORE__PARALLELISM: "2"
  AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
  AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"

  # Local-only configuration; generate .env using tools/init_local.py.
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Run python tools/init_local.py}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?Run python tools/init_local.py}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Run python tools/init_local.py}

  # Simple Auth Manager for local teaching use.
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/simple_auth_manager_passwords.json.generated

  POSTGRES_CACHE_HOST: operational-cache-postgres
  POSTGRES_CACHE_PORT: 5432
  POSTGRES_CACHE_DB: citibike_cache
  POSTGRES_CACHE_USER: cache_user
  POSTGRES_CACHE_PASSWORD: ${POSTGRES_CACHE_PASSWORD:?Run python tools/init_local.py}
  JAVA_HOME: /opt/java/openjdk
  SPARK_HOME: /home/airflow/.local/lib/python3.11/site-packages/pyspark
  PYTHONPATH: /opt/airflow

x-airflow-common-volumes: &airflow-common-volumes
  - ./airflow_auth:/opt/airflow/auth:rw
  - ./artifacts:/opt/airflow/artifacts:rw
  - ./config:/opt/airflow/config:rw
  - ./dags:/opt/airflow/dags:rw
  - ./data:/opt/airflow/data:rw
  - ./jobs:/opt/airflow/jobs:rw
  - ./logs:/opt/airflow/logs:rw
  - ./models:/opt/airflow/models:rw
  - ./notebooks:/opt/airflow/notebooks:rw
  - ./sql:/opt/airflow/sql:rw
  - ./tools:/opt/airflow/tools:rw

services:
  airflow-metadata-db:
    image: postgres:17-alpine
    container_name: citibike_airflow_metadata_postgres
    environment:
      - POSTGRES_DB=airflow_metadata
      - POSTGRES_USER=airflow_user
      - POSTGRES_PASSWORD=${POSTGRES_METADATA_PASSWORD:?Run python tools/init_local.py}
    ports:
      - "5542:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - platform_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airflow_user -d airflow_metadata" ]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    user: "${AIRFLOW_UID:-1000}:0"
    build:
      context: ./airflow-image
      dockerfile: Dockerfile
    image: citibike-airflow-spark-iceberg:3.2.2-python3.11
    container_name: citibike_airflow_init_job
    depends_on:
      airflow-metadata-db:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    command: >
      bash -c '
        mkdir -p /opt/airflow/auth /opt/airflow/data/citibike/incoming /opt/airflow/data/citibike/warehouse /opt/airflow/logs &&
        if [ ! -f /opt/airflow/auth/simple_auth_manager_passwords.json.generated ]; then
          python -m tools.init_airflow_auth;
        fi &&
        airflow db migrate &&
        airflow pools set citibike_spark 1 "Serialize local Spark jobs within the laptop memory budget"
      '
    networks:
      - platform_network
    restart: "no"

  airflow-webserver:
    user: "${AIRFLOW_UID:-1000}:0"
    image: citibike-airflow-spark-iceberg:3.2.2-python3.11
    pull_policy: never
    container_name: citibike_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-env
    ports:
      - "18080:8080"
    volumes: *airflow-common-volumes
    command: airflow api-server
    networks:
      - platform_network
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8080/api/v2/monitor/health\", timeout=3).getcode() == 200 else 1)'" ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  airflow-scheduler:
    user: "${AIRFLOW_UID:-1000}:0"
    image: citibike-airflow-spark-iceberg:3.2.2-python3.11
    pull_policy: never
    container_name: citibike_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
    volumes: *airflow-common-volumes
    command: airflow scheduler
    networks:
      - platform_network
    restart: always

  airflow-dag-processor:
    user: "${AIRFLOW_UID:-1000}:0"
    image: citibike-airflow-spark-iceberg:3.2.2-python3.11
    pull_policy: never
    container_name: citibike_airflow_dag_processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "5"
    volumes: *airflow-common-volumes
    command: airflow dag-processor
    networks:
      - platform_network
    restart: always

  mock-lambda-watcher:
    image: python:3.11-slim
    container_name: citibike_mock_lambda_watcher
    depends_on:
      airflow-webserver:
        condition: service_healthy
    volumes:
      - ./sftp_mock_daemon.py:/app/sftp_mock_daemon.py
      - ./data:/opt/airflow/data:rw
    working_dir: /app
    environment:
      AIRFLOW_BASE_URL: http://airflow-webserver:8080
      AIRFLOW_USERNAME: admin
      AIRFLOW_PASSWORD: admin
      WATCH_DIRECTORY: /opt/airflow/data/citibike/incoming
      TARGET_ASSET_URI: file:///opt/airflow/data/citibike/incoming/citibike_data_drop
    networks:
      - platform_network
    command: >
      sh -c "pip install --no-cache-dir watchdog requests &&
             python /app/sftp_mock_daemon.py"
    # command: >
    #   sh -c "pip install --no-cache-dir watchdog requests &&
    #          tail -f /dev/null"
    restart: always

  jupyter-notebook:
    user: "${AIRFLOW_UID:-1000}:0"
    image: citibike-airflow-spark-iceberg:3.2.2-python3.11
    pull_policy: never
    container_name: citibike_jupyter_notebook
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-env
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?Run python tools/init_local.py}
      HOME: /home/airflow
      JUPYTER_RUNTIME_DIR: /tmp/jupyter-runtime
      JUPYTER_CONFIG_DIR: /tmp/jupyter-config
      JUPYTER_DATA_DIR: /tmp/jupyter-data
    ports:
      - "8889:8888"
    volumes: *airflow-common-volumes
    working_dir: /opt/airflow
    entrypoint: []
    command: >
      /home/airflow/.local/bin/python -m notebook
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
    networks:
      - platform_network
    restart: unless-stopped

  fastapi:
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    container_name: citibike_fastapi
    environment:
      POSTGRES_CACHE_HOST: operational-cache-postgres
      POSTGRES_CACHE_PORT: 5432
      POSTGRES_CACHE_DB: citibike_cache
      POSTGRES_CACHE_USER: cache_user
      POSTGRES_CACHE_PASSWORD: ${POSTGRES_CACHE_PASSWORD:?Run python tools/init_local.py}
      PREDICTIONS_DIR: /opt/airflow/data/citibike/predictions
    depends_on:
      operational-cache-postgres:
        condition: service_healthy
    volumes:
      - ./data:/opt/airflow/data
    ports:
      - "8010:8000"
    networks:
      - platform_network

  streamlit:
    build:
      context: .
      dockerfile: streamlit/Dockerfile
    container_name: citibike_streamlit
    environment:
      API_BASE_URL: http://fastapi:8000
      STATION_ID: "${STATION_ID:-}"
    depends_on:
      - fastapi
    ports:
      - "8502:8501"
    networks:
      - platform_network

  operational-cache-postgres:
    image: postgres:16-alpine
    container_name: citibike_operational_cache_postgres
    environment:
      POSTGRES_USER: cache_user
      POSTGRES_PASSWORD: ${POSTGRES_CACHE_PASSWORD:?Run python tools/init_local.py}
      POSTGRES_DB: citibike_cache
    ports:
      - "5543:5432"
    networks:
      - platform_network
    volumes:
      - operational_cache_data:/var/lib/postgresql/data
      - ./sql/citibike_cache.sql:/docker-entrypoint-initdb.d/01-citibike-cache.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cache_user -d citibike_cache" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  db_data:
  operational_cache_data:

networks:
  platform_network:
    driver: bridge

